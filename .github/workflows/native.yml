name: Native Build

on:
  push:
    branches: [ develop, v2.x-develop ]
  pull_request:
    branches: [ develop, v2.x-develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-latest ]
    steps:
      - name: "Cache Maven Repos"
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'graalvm'
      - name: "Print Maven version"
        run: ./mvnw -version
      - name: "Install dependencies"
        run: ./mvnw -T 4C clean -B -pl bootstrap install -Prelease-nacos -DskipTests -am
      - name: "Compile native image"
        run: ./mvnw -T 2C -B -pl bootstrap package -DskipTests -Pnative spring-boot:process-aot native:compile
      - name: "Upload binaries for ${{ matrix.module }} in ${{ matrix.os }}"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: |
            bootstrap/target/nacos-bootstrap-*-*
            !bootstrap/target/*.jar
          if-no-files-found: error

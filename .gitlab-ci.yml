stages:
  - build

build:
  stage: build
  image: $IMAGE_NAME
  variables:
    IMAGE_NAME: registry.cn-qingdao.aliyuncs.com/xuxiaoweicomcn/mvnd:1.0.2-dragonwell-17-anolis
    SETTINGS_FILE: settings.xml
    MAVEN_OPTS: >-
      -Dhttps.protocols=TLSv1.2
      -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
      -Dorg.slf4j.simpleLogger.showDateTime=true
      -Djava.awt.headless=true
    MAVEN_CLI_OPTS: >-
      --batch-mode
      --errors
      --fail-at-end
      --show-version
      --no-transfer-progress
      -DinstallAtEnd=true
      -DdeployAtEnd=true
    MAVEN_DEPENDENCIES_URL: https://github.com/xuxiaowei-com-cn/maven-dependencies/releases/download/v0.0.0-2024-02-29T16-20Z/maven-dependencies-linux-amd64
    POM_XML: |
      <plugin>
          <groupId>org.sonatype.central</groupId>
          <artifactId>central-publishing-maven-plugin</artifactId>
          <version>${central-publishing-maven-plugin.version}</version>
          <extensions>true</extensions>
          <configuration>
              <publishingServerId>central</publishingServerId>
          </configuration>
      </plugin>
  script:
    - GPG_FILE=`find / -name xuxiaowei_0x30F97859_SECRET`
    - echo $GPG_FILE
    - gpg --import $GPG_FILE
    - echo $SETTINGS_FILE
    - git --version || echo
    - VERSION=3.0.0
    - echo $VERSION
    # 大写版本号
    - NACOS_TAG_VERSION=3.0.0
    - echo $NACOS_TAG_VERSION
    - git --version || yum -y install git
    - wget --version || yum -y install wget
    - git clone --depth 1 --branch $NACOS_TAG_VERSION https://github.com/alibaba/nacos.git
    - rm ./nacos/console/src/main/resources/static -rf
    - NACOS_TAG_VERSION=$VERSION
    - POM_XML=$(echo -e "$POM_XML" | tr -d '\n')
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/auth/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/cmdb/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/consistency/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/config/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/console/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/core/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/istio/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/k8s-sync/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/lock/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/naming/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/plugin-default-impl/nacos-default-auth-plugin/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/plugin-default-impl/nacos-default-control-plugin/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/plugin-default-impl/nacos-default-plugin-all/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/persistence/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/prometheus/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/sys/pom.xml
    - sed -i "s#</plugins>#$POM_XML&#" ./nacos/server/pom.xml
    - echo $MAVEN_DEPENDENCIES_URL
    - wget -O maven-dependencies $MAVEN_DEPENDENCIES_URL
    - chmod +x maven-dependencies
    - ./maven-dependencies current      edit --file-path=$CI_PROJECT_DIR/nacos/auth/pom.xml                                               --after-group-id=io.xuxiaowei.nacos   --after-version=$VERSION
    - ./maven-dependencies current      edit --file-path=$CI_PROJECT_DIR/nacos/cmdb/pom.xml                                               --after-group-id=io.xuxiaowei.nacos   --after-version=$VERSION

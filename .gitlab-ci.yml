    - ./maven-dependencies dependency   edit --file-path=$CI_PROJECT_DIR/nacos/server/pom.xml                                             --group-id=com.alibaba.nacos      --artifact-id=nacos-istio                       --after-group-id=io.xuxiaowei.nacos --after-version=$NACOS_TAG_VERSION
    - ./maven-dependencies dependency   edit --file-path=$CI_PROJECT_DIR/nacos/server/pom.xml                                             --group-id=com.alibaba.nacos      --artifact-id=nacos-prometheus                  --after-group-id=io.xuxiaowei.nacos --after-version=$NACOS_TAG_VERSION
    - ./maven-dependencies dependency   edit --file-path=$CI_PROJECT_DIR/nacos/server/pom.xml                                             --group-id=com.alibaba.nacos      --artifact-id=nacos-default-plugin-all          --after-group-id=io.xuxiaowei.nacos --after-version=$NACOS_TAG_VERSION
    - mkdir -p        nacos/plugin-default-impl/nacos-default-plugin-all/src/main/java/io/xuxiaowei/nacos
    - cp Author.java  nacos/plugin-default-impl/nacos-default-plugin-all/src/main/java/io/xuxiaowei/nacos
    - cd nacos
    - >-
      mvn -V clean -U install -Dmaven.test.skip=true deploy -Prelease-sign-artifacts
      -pl auth
      -pl cmdb
      -pl consistency
      -pl config
      -pl console
      -pl core
      -pl istio
      -pl k8s-sync
      -pl lock
      -pl naming
      -pl plugin-default-impl/nacos-default-auth-plugin
      -pl plugin-default-impl/nacos-default-control-plugin
      -pl plugin-default-impl/nacos-default-plugin-all
      -pl persistence
      -pl prometheus
      -pl sys
      -pl server
      -s $SETTINGS_FILE
    - rm -rf $CI_PROJECT_DIR/.m2/repository/com/alibaba/nacos
    - rm -rf $CI_PROJECT_DIR/.m2/repository/io/xuxiaowei/nacos
  artifacts:
    name: "${CI_JOB_NAME}"
